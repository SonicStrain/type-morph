# Continuous Integration — runs on every push and pull request.
# Builds the project, runs all tests, and uploads a test report artifact.

name: CI

on:
  push:
    branches: [ "main", "master", "develop", "release" ]
  pull_request:
    branches: [ "main", "master", "develop", "release" ]

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # run all matrix entries even if one fails
      matrix:
        java: [ "17", "21" ]   # test on both LTS releases

    permissions:
      contents: read

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. JDK
      # -----------------------------------------------------------------------
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # -----------------------------------------------------------------------
      # 3. Maven dependency cache
      #    Key includes the hash of all pom.xml files so the cache is
      #    invalidated whenever a dependency version changes.
      # -----------------------------------------------------------------------
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # -----------------------------------------------------------------------
      # 4. Build + test (no install — keeps artifacts out of the local repo)
      # -----------------------------------------------------------------------
      - name: Build and run tests
        run: mvn -B verify --no-transfer-progress

      # -----------------------------------------------------------------------
      # 5. Upload Surefire XML reports so GitHub can display test results
      # -----------------------------------------------------------------------
      - name: Upload test reports
        if: always()    # upload even when tests fail, so failures are inspectable
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: |
            **/target/surefire-reports/*.xml
          retention-days: 7
